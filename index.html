<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon TCG Deck Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header with controls -->
    <div class="header">
      <div class="title">
        <span class="pokeball">⚪</span>
        <span>Deck Tracker</span>
      </div>
      <div class="controls">
<button id="minimize-btn" class="control-btn" title="Minimize">−</button>
        <button id="close-btn" class="control-btn" title="Close">×</button>
      </div>
    </div>

    <!-- Stats Summary -->
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Deck:</span>
        <span id="deck-count" class="stat-value">60</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Discard:</span>
        <span id="discard-count" class="stat-value">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Prizes:</span>
        <span id="prize-count" class="stat-value">6</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="draw-btn" class="action-btn">Draw Card</button>
      <button id="reset-btn" class="action-btn secondary">Reset Game</button>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search cards..." />
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="deck">Deck List</button>
      <button class="tab-btn" data-tab="discard">Discard Pile</button>
    </div>

    <!-- Card Lists -->
    <div class="tab-content active" id="deck-tab">
      <div id="deck-list" class="card-list"></div>
    </div>

    <div class="tab-content" id="discard-tab">
      <div id="discard-list" class="card-list"></div>
    </div>

    <!-- Import Deck Section -->
    <div class="import-section">
      <button id="import-btn" class="action-btn secondary">Build Deck</button>
    </div>
  </div>

  <!-- Deck Builder Modal -->
  <div id="deck-builder-modal" class="modal">
    <div class="modal-content deck-builder">
      <div class="deck-builder-header">
        <h3>Deck Builder</h3>
        <div class="deck-builder-stats">
          <span id="builder-card-count">0</span>/60 cards
        </div>
      </div>

      <!-- Card Search -->
      <div class="card-search-section">
        <input type="text" id="card-search-input" placeholder="Search for cards..." autocomplete="off" />
        <div class="search-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="Pokemon">Pokemon</button>
          <button class="filter-btn" data-filter="Trainer">Trainer</button>
          <button class="filter-btn" data-filter="Energy">Energy</button>
        </div>
      </div>

      <!-- Search Results -->
      <div id="search-results" class="search-results">
        <div class="search-placeholder">Type to search for cards...</div>
      </div>

      <!-- Current Deck -->
      <div class="current-deck-section">
        <div class="section-header">
          <span>Current Deck</span>
          <button id="clear-deck-btn" class="small-btn">Clear</button>
        </div>
        <div id="current-deck-list" class="current-deck-list"></div>
      </div>

      <!-- Modal Actions -->
      <div class="modal-buttons">
        <button id="save-deck-btn" class="action-btn">Save Deck</button>
        <button id="cancel-deck-btn" class="action-btn secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
