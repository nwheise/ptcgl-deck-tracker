<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon TCG Deck Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header with controls -->
    <div class="header">
      <div class="title">
        <span class="pokeball">⚪</span>
        <span>Deck Tracker</span>
      </div>
      <div class="controls">
        <button id="minimize-btn" class="control-btn" title="Minimize">−</button>
        <button id="close-btn" class="control-btn" title="Close">×</button>
      </div>
    </div>

    <!-- Deck Name Display -->
    <div class="deck-name-display">
      <span id="current-deck-name">No Deck Loaded</span>
    </div>

    <!-- Stats Summary -->
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Cards:</span>
        <span id="deck-count" class="stat-value">0</span>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search cards..." />
    </div>

    <!-- Single Card List -->
    <div class="deck-section">
      <div id="deck-list" class="card-list"></div>
    </div>

    <!-- Action Buttons -->
    <div class="import-section">
      <button id="import-btn" class="action-btn secondary">Build Deck</button>
      <button id="import-text-btn" class="action-btn secondary">Import Deck</button>
      <button id="history-btn" class="action-btn secondary">History</button>
      <button id="matches-btn" class="action-btn secondary">Matches</button>
    </div>

    <!-- Tracking Controls -->
    <div class="tracking-section">
      <button id="track-btn" class="action-btn track-btn">▶ Record Game Session</button>
      <span id="track-status" class="track-status"></span>
    </div>
  </div>

  <!-- Import Deck Modal -->
  <div id="import-deck-modal" class="modal">
    <div class="modal-content import-deck">
      <div class="import-deck-header">
        <h3>Import Deck</h3>
      </div>
      <p class="import-instructions">Paste your deck list exported from Pokemon TCG Live:</p>
      <textarea id="deck-import-text" placeholder="Pokémon: 6
1 Togekiss SSP 72
4 Gholdengo ex PAR 139
..."></textarea>
      <div class="import-deck-name-section">
        <label for="import-deck-name">Deck Name (optional):</label>
        <input type="text" id="import-deck-name" placeholder="Leave blank for auto-generated name" />
      </div>
      <div id="import-error" class="import-error"></div>
      <div class="modal-buttons">
        <button id="import-deck-btn" class="action-btn">Import</button>
        <button id="cancel-import-btn" class="action-btn secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Deck History Modal -->
  <div id="deck-history-modal" class="modal">
    <div class="modal-content deck-history">
      <div class="deck-history-header">
        <h3>Deck History</h3>
      </div>
      <div id="deck-history-list" class="deck-history-list"></div>
      <div class="modal-buttons">
        <button id="close-history-btn" class="action-btn secondary">Close</button>
      </div>
    </div>
  </div>

  <!-- Card Preview Tooltip -->
  <div id="card-preview" class="card-preview">
    <img id="card-preview-image" src="" alt="Card Preview" />
  </div>

  <!-- Deck Builder Modal -->
  <div id="deck-builder-modal" class="modal">
    <div class="modal-content deck-builder">
      <div class="deck-builder-header">
        <h3>Deck Builder</h3>
        <div class="deck-builder-stats">
          <span id="builder-card-count">0</span>/60 cards
        </div>
      </div>

      <!-- Card Search -->
      <div class="card-search-section">
        <input type="text" id="card-search-input" placeholder="Search for cards..." autocomplete="off" />
        <div class="search-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="Pokemon">Pokemon</button>
          <button class="filter-btn" data-filter="Trainer">Trainer</button>
          <button class="filter-btn" data-filter="Energy">Energy</button>
          <label class="standard-toggle">
            <input type="checkbox" id="standard-only-toggle" />
            <span class="toggle-label">Standard Only</span>
          </label>
        </div>
      </div>

      <!-- Search Results -->
      <div id="search-results" class="search-results">
        <div class="search-placeholder">Type to search for cards...</div>
      </div>

      <!-- Current Deck -->
      <div class="current-deck-section">
        <div class="section-header">
          <span>Current Deck</span>
          <button id="clear-deck-btn" class="small-btn">Clear</button>
        </div>
        <div id="current-deck-list" class="current-deck-list"></div>
      </div>

      <!-- Deck Name -->
      <div class="builder-deck-name-section">
        <label for="builder-deck-name">Deck Name (optional):</label>
        <input type="text" id="builder-deck-name" placeholder="Leave blank for auto-generated name" />
      </div>

      <!-- Modal Actions -->
      <div class="modal-buttons">
        <button id="save-deck-btn" class="action-btn">Save Deck</button>
        <button id="cancel-deck-btn" class="action-btn secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Import Match Log Modal -->
  <div id="import-match-modal" class="modal">
    <div class="modal-content import-deck">
      <div class="import-deck-header">
        <h3>Import Match Log</h3>
      </div>
      <p class="import-instructions">Paste your game log copied from Pokemon TCG Live:</p>
      <textarea id="match-import-text" placeholder="Setup
PlayerName chose heads for the opening coin flip.
..."></textarea>
      <div id="match-import-error" class="import-error"></div>
      <div class="modal-buttons">
        <button id="import-match-btn" class="action-btn">Import</button>
        <button id="cancel-import-match-btn" class="action-btn secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Match History Modal -->
  <div id="match-history-modal" class="modal">
    <div class="modal-content deck-history">
      <div class="deck-history-header">
        <h3>Match History</h3>
        <button id="import-match-from-history-btn" class="small-btn">+ Import</button>
      </div>
      <div id="match-history-list" class="deck-history-list"></div>
      <div class="modal-buttons">
        <button id="close-match-history-btn" class="action-btn secondary">Close</button>
      </div>
    </div>
  </div>

  <!-- Match Detail Modal -->
  <div id="match-detail-modal" class="modal">
    <div class="modal-content match-detail">
      <div class="match-detail-header">
        <button id="match-detail-back-btn" class="small-btn">← Back</button>
        <div class="match-detail-title">
          <h3 id="match-detail-opponent">vs. Opponent</h3>
          <span id="match-detail-result" class="match-result-badge">W</span>
        </div>
        <div id="match-detail-date" class="match-detail-date"></div>
      </div>
      <div id="match-detail-log" class="match-detail-log"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
